<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>p5.js 簡易指令測驗</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&family=Stylish&display=swap" rel="stylesheet">
  <style>
    :root {
      font-family: "LXGW WenKai TC", "Stylish", sans-serif;
      font-weight: 400;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #f7fbff;
      font-family: "LXGW WenKai TC", "Stylish", sans-serif;
      font-weight: 400;
    }

    body {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      position: fixed;
      inset: 0;
      z-index: 0;
      font-family: "LXGW WenKai TC", "Stylish", sans-serif;
      font-weight: 400;
    }

    button,
    button * {
      font-family: "LXGW WenKai TC", "Stylish", sans-serif !important;
      font-weight: 400 !important;
    }

    .font-latin {
      font-family: "Stylish", sans-serif !important;
      font-weight: 400 !important;
    }

    .font-chinese {
      font-family: "LXGW WenKai TC", sans-serif !important;
      font-weight: 400 !important;
    }
  </style>
</head>
<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.1/p5.min.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
